[pytest]
minversion = 7.0

# Verhindert Import-Kollisionen bei identischen Test-Dateinamen
# (test_cli.py, test_logging.py, etc. in mehreren modes)
addopts = --import-mode=importlib -ra

# Sinnvolle Standard-Testpfade
# (pytest im Root läuft dann kontrolliert)
testpaths =
    modes

# Typische Marker (optional, aber sauber vorbereitet)
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: integration tests
    schema: schema validation tests

# Sauberere Ausgabe
console_output_style = progress

